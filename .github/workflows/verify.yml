name: 検証

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 定理 15 項目 / 印字された数値 32 項目 / 正誤表の監査 109 項目 / 経路 143 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 誤変換とバッジ記法
        run: python3 verification/check_text.py
      - name: 定理は正しいか
        run: python3 verification/independent_check.py
      - name: 印字された数値はその通りに出るか
        run: python3 verification/claims_audit.py
      - name: 正誤表の引用が紙面と一致するか
        run: python3 verification/check_errata.py
      - name: 経路の表が筋を保っているか
        run: python3 verification/check_route.py
      # 前提の一覧と年表は、trinity-operator の文書と突き合わせる。誤変換の検査が
      # 写しの中まで走らないよう、この checkout は誤変換の検査より後に置く。
      - uses: actions/checkout@v7
        with:
          repository: cpsbvbng26-dotcom/trinity-operator
          path: _sibling/trinity-operator
      - name: 札・位置づけ・前提の一覧・年表・関連識別子
        env:
          TRINITY_OPERATOR: _sibling/trinity-operator
        run: python3 verification/check_pages.py
