name: 検証

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 定理 15 項目 / 印字された数値 32 項目 / 正誤表の監査 108 項目 / 経路 113 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 誤変換とバッジ記法
        run: python3 verification/check_text.py
      - name: 定理は正しいか
        run: python3 verification/independent_check.py
      - name: 印字された数値はその通りに出るか
        run: python3 verification/claims_audit.py
      - name: 正誤表の引用が紙面と一致するか
        run: python3 verification/check_errata.py
      - name: 経路の表が筋を保っているか
        run: python3 verification/check_route.py
